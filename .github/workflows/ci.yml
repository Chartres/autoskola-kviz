name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per ref: a newer push supersedes an older run of the same branch or PR, but a PR run
# never cancels main's deploy (one shared group did, so merges went undeployed).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # The dist uploaded below must carry the Supabase config, or the live app sends no events.
      - run: node scripts/check-analytics.mjs dist # flywheel:analytics-guard
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One Pages deployment at a time; a queued one waits instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write # the release tag below
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # FLYWHEEL-STANDARD §5: tag the deployed commit deploy-<yyyy-mm-dd>[-n] (UTC). Same logic as
      # flywheel scripts/release-tag.sh deploy; never moves a tag, a re-run adds none. A tag pushed
      # with GITHUB_TOKEN triggers no workflow.
      - uses: actions/checkout@v4
      - name: Tag the deployed commit
        run: |
          remote=$(git ls-remote --tags origin)
          awk -v s="$GITHUB_SHA" '$1==s && $2 ~ /^refs\/tags\/deploy-/ {f=1} END {exit !f}' <<<"$remote" && exit 0
          base=deploy-$(date -u +%F)
          n=$(grep -cE "refs/tags/$base(-[0-9]+)?$" <<<"$remote" || true)
          name=$base; [ "$n" -gt 0 ] && name=$base-$((n + 1))
          git push origin "$GITHUB_SHA:refs/tags/$name"
          echo "tagged $name"
