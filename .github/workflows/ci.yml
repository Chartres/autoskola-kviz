name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per ref: a newer push supersedes an older run of the same branch or PR, but a PR run
# never cancels main's deploy (one shared group did, so merges went undeployed).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One Pages deployment at a time; a queued one waits instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write # the release tag below
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # FLYWHEEL-STANDARD §5: tag the deployed commit deploy-<yyyy-mm-dd>[-n] (UTC). Same logic as
      # flywheel scripts/release-tag.sh deploy; never moves a tag, a re-run adds none. A tag pushed
      # with GITHUB_TOKEN triggers no workflow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the IndexNow step below compares with the previous commit
      - name: Tag the deployed commit
        run: |
          remote=$(git ls-remote --tags origin)
          awk -v s="$GITHUB_SHA" '$1==s && $2 ~ /^refs\/tags\/deploy-/ {f=1} END {exit !f}' <<<"$remote" && exit 0
          base=deploy-$(date -u +%F)
          n=$(grep -cE "refs/tags/$base(-[0-9]+)?$" <<<"$remote" || true)
          name=$base; [ "$n" -gt 0 ] && name=$base-$((n + 1))
          git push origin "$GITHUB_SHA:refs/tags/$name"
          echo "tagged $name"
      # IndexNow (Bing — which feeds ChatGPT search and Copilot — Seznam, Yandex, …): announce the
      # site's URLs when a deploy changed pages or their data. Free, no account; the key file is
      # public/<key>.txt. A failed ping never fails the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          HOST: autoskola.dravec.org
          KEY: ae860ea4fbdae2b80e581f3d7f52b94f
        run: |
          git diff --quiet HEAD~1 HEAD -- data public scripts index.html src/content && { echo "no page changes"; exit 0; }
          sleep 60 # let Pages serve the new build first
          urls=$(curl -sS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow: $(jq length <<<"$urls") URLs, HTTP $code"
